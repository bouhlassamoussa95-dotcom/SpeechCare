.act-feedback{border-radius:14px;padding:11px;margin:10px 0;background:color-mix(in srgb,var(--tea) 12%,var(--card));line-height:1.7}.act-step{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin:7px 0}.act-step .txt{flex:1}.act-step button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 9px;color:var(--ink)}
.act-scene{background:linear-gradient(135deg,#dff4ef,#e6edff);color:#183c46;border-radius:16px;padding:16px;line-height:2;font-size:20px;margin:8px 0}.act-progress{height:7px;border-radius:8px;background:var(--line);overflow:hidden}.act-progress span{display:block;height:100%;background:var(--tea);transition:width .22s ease}
.act-note{font-size:12px;color:var(--mut);line-height:1.65}.act-text{direction:rtl;text-align:right;unicode-bidi:plaintext;font-family:Cairo,system-ui,sans-serif}
@media(max-width:380px){.act-grid{grid-template-columns:1fr}.act-card{min-height:100px}}
input,textarea{font-size:16px}input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],input[type=time]{direction:ltr;unicode-bidi:plaintext}

const TOYC=[['speech','Speech sounds'],['language','Language and comprehension'],['motor','Fine motor skills'],['attn','Attention and memory'],['social','Social play'],['other','Other']];
let TOYIMGS=[];
const toyCat=k=>T((TOYC.find(x=>x[0]==k)||TOYC[5])[1]);
function toyActRow(id,i,v){return `<div class="row" style="flex-wrap:nowrap;margin:0 0 6px"><input dir=auto value="${esc(v)}" placeholder="Activity name" style="margin:0" onchange="toyActSet('${id}',${i},this.value)" onkeydown="if(event.key=='Enter'){event.preventDefault();toyActAdd('${id}')}"><button type=button class=ib data-danger aria-label="Remove" onclick="toyActRm('${id}',${i})">${ic('x',18)}</button></div>`}
function toys(){const L=S.toys||[];L.forEach(t=>t.acts=(t.acts||[]).filter(a=>a&&a.trim()));return `<div class=act-note style="margin:0 2px 10px">${T('Therapy toys and materials')}</div>${L.map(t=>`<div class="card sec" style="--c:#c9407a"><div class="apt" role=button tabindex=0 onclick="toyForm('${t.id}')" style="align-items:center">${t.img?`<img src="${t.img}" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:14px;flex:none">`:`<div class=av style="width:84px;height:84px;border-radius:14px;background:var(--chip);color:var(--pri)">${ic('box',34)}</div>`}<div style="flex:1;min-width:0"><div class="row sp" style="flex-wrap:nowrap"><h3>${t.name?esc(t.name):`<span class=mut>${T('Untitled toy')}</span>`}</h3><span class=navchev>${ic('chev',18)}</span></div><span class=chip>${toyCat(t.cat)}</span></div></div>
<div class=mut style="margin:8px 0 6px">${T('Linked activities')}</div><div id="tal_${t.id}">${(t.acts||[]).map((a,i)=>toyActRow(t.id,i,a)).join('')}</div>
<div class=row><button type=button class="b s" onclick="toyActAdd('${t.id}')">${ic('plus',16)} Add activity</button><button type=button class="b g s" onclick="uxAskToyActs('${t.id}')">${ic('chat',14)} Suggest activities with AI</button></div></div>`).join('')||'<div class="card mut">No toys yet. Tap + Toy.</div>'}`}
function toyActAdd(id){const t=S.toys.find(x=>x.id==id);if(!t)return;t.acts=t.acts||[];const box=$('#tal_'+id);if(!box)return;const i=t.acts.length;t.acts.push('');box.insertAdjacentHTML('beforeend',toyActRow(id,i,''));const inp=box.lastElementChild.querySelector('input');inp.focus();inp.scrollIntoView({block:'center',behavior:'smooth'})}
function toyActSet(id,i,v){const t=S.toys.find(x=>x.id==id);if(!t)return;t.acts[i]=v.trim();save()}
function toyActRm(id,i){const t=S.toys.find(x=>x.id==id);if(!t)return;t.acts.splice(i,1);save();go()}
function toyRead(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=480,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res('');im.src=r.result};r.onerror=()=>res('');r.readAsDataURL(f)})}
async function toyShot(inp){const fs=[...(inp.files||[])];if(!fs.length)return;toast('Adding photos…');const out=[];for(const f of fs){const d=await toyRead(f);if(d)out.push(d)}TOYIMGS=inp.multiple?out:out.slice(0,1);const pv=$('#t_pv');if(pv)pv.innerHTML=TOYIMGS.map(u=>`<img src="${u}" alt="" style="width:${TOYIMGS.length>1?'31%':'100%'};max-height:${TOYIMGS.length>1?'90px':'200px'};object-fit:cover;border-radius:12px;margin:0 1% 6px 0">`).join('');const n=$('#t_nm');if(n)n.hidden=TOYIMGS.length>1;const h=$('#t_hint');if(h)h.textContent=TOYIMGS.length>1?T('Each photo will be added as its own toy, without a name.'):''}
function toyForm(id){const t=id?S.toys.find(x=>x.id==id):{name:'',cat:'speech',img:''};TOYIMGS=t.img?[t.img]:[];
sheet(`<h2>${id?'Edit toy':'New toy'}</h2><div id=t_pv style="margin-bottom:8px">${t.img?`<img src="${t.img}" alt="" style="width:100%;max-height:200px;object-fit:cover;border-radius:16px">`:''}</div><button type=button class="b s t" onclick="$('#t_file').click()">${ic('plus',16)} ${id?'Take or choose a photo':'Choose photos (each photo becomes its own toy)'}</button><input id=t_file type=file accept="image/*" ${id?'':'multiple'} hidden onchange="toyShot(this)"><div class=mut id=t_hint style="margin-top:6px"></div>
<div id=t_nm><label>Toy name (optional)</label><input id=t_name dir=auto value="${esc(t.name)}"></div><label>Category</label><select id=t_cat>${TOYC.map(x=>`<option value=${x[0]}${x[0]==t.cat?' selected':''}>${x[1]}</option>`).join('')}</select>
<div class=row style="margin-top:8px"><button class=b onclick="saveToy('${id||''}')">Save</button><button class="b g" onclick="cs()">Cancel</button>${id?`<button class="b r" data-danger onclick="delToy('${id}')">Delete toy</button>`:''}</div>`)}
function saveToy(id){const cat=$('#t_cat').value,nm=($('#t_name')&&!$('#t_nm').hidden)?$('#t_name').value.trim():'';if(id){Object.assign(S.toys.find(x=>x.id==id),{name:nm,cat,img:TOYIMGS[0]||''})}else if(TOYIMGS.length){TOYIMGS.forEach(u=>S.toys.push({id:uid(),name:TOYIMGS.length==1?nm:'',cat,img:u,acts:[]}))}else S.toys.push({id:uid(),name:nm,cat,img:'',acts:[]});save();cs();go();toast('Toy saved')}
function delToy(id){S.toys=S.toys.filter(x=>x.id!=id);save();cs();go()}

const SYS=(l,mode='auto')=>{const target=mode&&mode!='auto'?mode:(l&&['en','fr','ar'].includes(l)?l:'auto');const rule=target=='ar'?'Reply entirely in natural Algerian Arabic/Darija (Dzairi), not Moroccan or Egyptian. Use simple Modern Standard Arabic only for formal clinical terminology when needed. Write child-facing prompts and parent advice in everyday Algerian Darija; keep therapist guidance clear and respectful.':target=='fr'?'Réponds entièrement en français clair et professionnel, avec un vocabulaire d’orthophonie accessible. Les consignes destinées aux enfants et aux parents doivent être simples, naturelles et bienveillantes.':'Detect the language of the latest user message and answer in that same language (Arabic/Algerian Darija, French, or English). If the user writes Algerian Darija, answer in Algerian Darija; do not switch to English unless requested.';return `You are SpeechCare Assistant, a warm, expert clinical co-pilot for a speech-language therapist (orthophoniste, neurolinguist) in Algeria who works in French, Arabic (including Algerian Darija) and English with children and adults. ${rule} Scope: articulation and phonological disorders, apraxia of speech, language delay, developmental language disorder, ADHD, learning difficulties (dyslexia, dyscalculia, dysgraphia, dysorthographia), stuttering, voice, hearing loss, aphasia, Alzheimer, Parkinson, post-stroke, TBI, cerebral palsy. Be practical: concrete activities, materials, example words or sentences in the patient's language, grade difficulty, measure progress, SMART goals, session structure, parent coaching, and behaviour tips. Ask at most one short clarifying question, only if essential. Mention red flags that need referral when relevant. Give options, never a final diagnosis: the therapist decides. Keep answers concise and organised with useful headings and bullets.`};
async function gem(msgs,sys,json){
 const key=OR_KEY(),model=OR_MODEL();if(!key)throw{code:'nokey'};if(!isFreeModel(model))throw{code:'paidmodel'};
 const payload={model,messages:[{role:'system',content:sys},...msgs.map(m=>({role:m.r=='u'?'user':'assistant',content:m.t}))],temperature:0.4};
 const headers={'Content-Type':'application/json','Authorization':'Bearer '+key,'X-OpenRouter-Title':'SpeechCare'};
 let status=0,d={};
 try{
  const cap=window.Capacitor, nativeHttp=(cap&&cap.Plugins&&cap.Plugins.CapacitorHttp)||(window.CapacitorHttp);
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&nativeHttp&&nativeHttp.request){
   const response=await nativeHttp.request({url:OR_ENDPOINT(),method:'POST',headers,data:payload,connectTimeout:30000,readTimeout:60000});
   status=response.status||0;d=typeof response.data==='string'?JSON.parse(response.data):response.data||{};
  }else{
   const response=await fetch(OR_ENDPOINT(),{method:'POST',headers,body:JSON.stringify(payload)});
   status=response.status;d=await response.json().catch(()=>({}));
  }
 }catch(e){if(e&&e.code)throw e;throw{code:'net',msg:e&&e.message};}
 if(status<200||status>=300)throw{code:status||'net',msg:d.error?.message||d.error||d.message||'OpenRouter request failed'};
 const answer=d.choices?.[0]?.message?.content;if(!answer)throw{code:'empty'};return answer;
}
function aiErr(e){const c=e&&e.code,m=String((e&&e.msg)||'');let t='AI request failed. Please try again.';
 if(c=='nokey')t='Please add your OpenRouter API key in Settings → AI.';
 else if(c==401)t='OpenRouter API key is invalid. Check your key in Settings → AI.';
 else if(c==402)t='OpenRouter could not serve this free model right now. Try again later.';
 else if(c==429)t='OpenRouter free request limit reached. Please wait and try again.';
 else if(c=='paidmodel')t='To avoid charges, use openrouter/free or a model ID ending in :free.';
 else if(c=='net')t='Could not connect to OpenRouter. Check internet connection.';
 else if(c=='empty')t='AI returned no answer. Please try again.';
 else if(c=='format')t='AI returned an unexpected report format. Please try again.';
 return T(t)+(m?` [${m.slice(0,180)}]`:'');
}

async function aiPolish(){
 const p=P(V.pid),nm=rn(p),b=body();if(!b.length)return;
 const mk=x=>nm?x.split(nm).join('[PATIENT]'):x,rs=x=>x.split('[PATIENT]').join(nm);
 $('#rmsg').textContent=T('Thinking…');
 try{
  const prompt='Improve this speech-language therapy report. Keep the same number and order of sections and keep every fact unchanged. Do not invent data. Write clearly and professionally in '+LN(V.rl)+'. Keep any [PATIENT] placeholder as is. Return only a valid JSON array of strings: one polished text per section, same order. Sections:\n'+JSON.stringify(b.map(x=>({title:x.t,text:mk(x.v)})));
  const out=await gem([{r:'u',t:prompt}],SYS(V.rl),1);
  let arr;
  try{arr=JSON.parse(out.replace(/```json|```/gi,'').trim())}catch(parseErr){const match=out.match(/\[[\s\S]*\]/);if(match)arr=JSON.parse(match[0])}
  if(!Array.isArray(arr))throw{code:'format'};
  document.querySelectorAll('.rs textarea').forEach((t,i)=>{if(typeof arr[i]=='string'&&arr[i].trim())t.value=rs(arr[i])});
  $('#rmsg').textContent=T('Report improved by AI. Please review it.')+' '+T('Review identifying details before sending.');
 }catch(e){$('#rmsg').textContent=aiErr(e)}
}
